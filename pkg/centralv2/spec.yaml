openapi: 3.1.0
info:
  version: 1.0.0
  title: ZeroTier Central V2 API
  description: |
    API for managing ZeroTier organizations, network groups, networks, and network members.

    ## Authentication

    All endpoints require an API key passed as a Bearer token:
    ```
    Authorization: Bearer <api-key>
    ```

    API keys are created for service accounts via the `/api/v2/org/{id}/service-account` and
    `/api/v2/service-account/{id}/api-key` endpoints. They can be revoked at any time.

    ## IAM

    Access to resources is controlled via role-based access control (RBAC). Roles are assigned per resource
    and inherited through the resource hierarchy: `org → network group → network`.
servers:
  - url: https://central.zerotier.com
    description: Production server
security:
  - BearerAuth: []
tags:
  - name: org
    x-displayName: Organizations
    description: Manage ZeroTier organizations. An organization is the top-level container for all resources.
  - name: network-group
    x-displayName: Network Groups
    description: Manage network groups. A network group is a collection of networks within an organization.
  - name: network
    x-displayName: Networks
    description: Manage ZeroTier networks. Networks define the virtual Layer 2 segment devices connect to.
  - name: member
    x-displayName: Network Members
    description: Manage devices (members) on a network. Members must be authorized before they can communicate.
  - name: service-account
    x-displayName: Service Accounts
    description: Manage service accounts and their API keys for programmatic access.
  - name: user
    x-displayName: Users
    description: Manage the authenticated user and invite new users to organizations.
  - name: webhook
    x-displayName: Webhooks
    description: Manage webhooks that deliver organization events to external HTTPS endpoints.
paths:
  /api/v2/org:
    get:
      operationId: listOrgs
      summary: List organizations
      description: Returns all organizations the authenticated user has access to.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: permission-check
          required: false
          explode: true
          description: List of permissions to check on each organization. Results include a `permissions` map keyed by permission name.
          schema:
            type: array
            items:
              type: string
        - in: query
          name: latest
          required: false
          description: Limits the list to 3 organizations with recent activity, plus any organizations whose IDs are included in this parameter.
          schema:
            type: array
            items:
              type: string
        - in: query
          name: stats
          required: false
          description: When true, includes aggregate statistics in the response.
          schema:
            type: boolean
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orgs'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      operationId: createOrg
      summary: Create organization
      description: Creates a new organization. The authenticated user becomes the owner.
      tags:
        - org
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        '200':
          description: Created organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/org/{id}:
    get:
      operationId: getOrg
      summary: Get organization
      description: Returns details of a specific organization.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      operationId: updateOrg
      summary: Update organization
      description: Updates properties of an existing organization. Only provided fields are updated.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgRequest'
      responses:
        '200':
          description: Updated organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
    delete:
      operationId: deleteOrg
      summary: Delete organization
      description: Permanently deletes an organization and all its resources.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      responses:
        '200':
          description: Organization deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/org/{id}/iam:
    get:
      operationId: getOrgIam
      summary: Get organization IAM
      description: Returns the current IAM role assignments for an organization.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      responses:
        '200':
          description: IAM role assignments for the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Iam'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      operationId: addOrgIam
      summary: Add organization IAM roles
      description: Grants additional roles to principals on this organization. Existing roles are preserved.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IamRequest'
      responses:
        '200':
          description: IAM roles added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
    put:
      operationId: replaceOrgIam
      summary: Replace organization IAM roles
      description: Replaces the entire IAM policy for this organization. All existing role assignments are overwritten.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IamRequest'
      responses:
        '200':
          description: IAM roles replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
    delete:
      operationId: removeOrgIam
      summary: Remove organization IAM roles
      description: Removes specific role assignments from this organization.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IamRequest'
      responses:
        '200':
          description: IAM roles removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/org/{id}/iam-tree:
    get:
      operationId: getOrgIamTree
      summary: Get organization IAM tree
      description: Returns the full hierarchical IAM structure for the organization, showing role assignments across all nested resources.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      responses:
        '200':
          description: Hierarchical IAM tree for the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IamLeaf'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/org/{id}/principal:
    get:
      operationId: searchPrincipals
      summary: Search principals
      description: Searches for users within an organization by email. Used for IAM assignment UIs.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
        - in: query
          name: search
          required: true
          description: Search term to match against user email addresses.
          schema:
            type: string
        - in: query
          name: principal-type
          required: false
          description: Filter results to specific principal types. Returns all types if omitted.
          schema:
            type: array
            items:
              type: string
              enum:
                - user
      responses:
        '200':
          description: Principals matching the search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principals'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/org/{id}/invite-users:
    post:
      operationId: inviteUsers
      summary: Invite users to organization
      description: Sends email invitations to one or more users to join an organization.
      tags:
        - user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invite'
      responses:
        '200':
          description: Invitations sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/org/{id}/subscription:
    get:
      operationId: getOrgSubscription
      summary: Get organization subscription
      description: Returns the current subscription plan and feature entitlements for an organization.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      responses:
        '200':
          description: Subscription details for the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/org/{id}/network-group:
    get:
      operationId: listOrgNetworkGroups
      summary: List organization network groups
      description: Returns all network groups within an organization the authenticated user has access to.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
        - in: query
          name: stats
          required: false
          description: When true, includes aggregate device and network statistics per group.
          schema:
            type: boolean
        - in: query
          name: permission-check
          required: false
          explode: true
          description: List of permissions to check on each network group.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Network groups in the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkGroups'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      operationId: createNetworkGroup
      summary: Create network group
      description: Creates a new network group within an organization.
      tags:
        - org
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The organization ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNetworkGroupRequest'
      responses:
        '200':
          description: Created network group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkGroup'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/network-group:
    get:
      operationId: listNetworkGroups
      summary: List network groups
      description: List all network groups the authenticated user has access to. Optionally filter by organization, include statistics, and check specific permissions.
      tags:
        - network-group
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: org-id
          required: false
          schema:
            type: string
          description: Filter network groups by organization ID
        - in: query
          name: stats
          required: false
          schema:
            type: boolean
          description: Include device and network statistics for each network group
        - in: query
          name: permission-check
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
          description: List of permissions to check for each network group (returned in the `permissions` field)
      responses:
        '200':
          description: Network groups the user has access to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkGroups'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/network-group/{id}:
    get:
      operationId: getNetworkGroup
      summary: Get network group
      description: Retrieve details for a specific network group by ID.
      tags:
        - network-group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The network group ID
      responses:
        '200':
          description: Network group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkGroup'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      operationId: updateNetworkGroup
      summary: Update network group
      description: Update the name or description of a network group.
      tags:
        - network-group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The network group ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkGroupRequest'
      responses:
        '200':
          description: Updated network group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkGroup'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
    delete:
      operationId: deleteNetworkGroup
      summary: Delete network group
      description: Permanently delete a network group. The networks of the group are also deleted.
      tags:
        - network-group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The network group ID
      responses:
        '200':
          description: Network group deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/network-group/{id}/iam:
    post:
      operationId: addNetworkGroupIam
      summary: Add network group IAM roles
      description: Grant additional IAM roles to users on this network group without replacing existing roles.
      tags:
        - network-group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The network group ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IamRequest'
      responses:
        '200':
          description: Network group IAM roles updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
    delete:
      operationId: removeNetworkGroupIam
      summary: Remove network group IAM roles
      description: Revoke IAM roles from users on this network group.
      tags:
        - network-group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The network group ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IamRequest'
      responses:
        '200':
          description: Network group IAM roles removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
    get:
      operationId: getNetworkGroupIam
      summary: Get network group IAM
      description: Retrieve all IAM role assignments for this network group.
      tags:
        - network-group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The network group ID
      responses:
        '200':
          description: IAM role assignments for the network group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Iam'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    put:
      operationId: replaceNetworkGroupIam
      summary: Replace network group IAM roles
      description: Replace all IAM role assignments on this network group. Existing roles not included in the request are removed.
      tags:
        - network-group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The network group ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IamRequest'
      responses:
        '200':
          description: Network group IAM roles replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/network-group/{id}/network:
    get:
      operationId: listNetworkGroupNetworks
      summary: List networks in network group
      description: List all networks within a network group. Optionally include device statistics and check specific permissions.
      tags:
        - network-group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The network group ID
        - in: query
          name: stats
          required: false
          schema:
            type: boolean
          description: Include device statistics for each network
        - in: query
          name: permission-check
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
          description: List of permissions to check for each network (returned in the `permissions` field)
      responses:
        '200':
          description: Networks in the network group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Networks'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      operationId: createNetwork
      summary: Create network
      description: Create a new network within a network group.
      tags:
        - network-group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The network group ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNetworkRequest'
      responses:
        '200':
          description: Created network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/network:
    get:
      operationId: listNetworks
      summary: List networks
      description: List all networks the authenticated user has access to. Optionally filter by organization, include device statistics, and check specific permissions.
      tags:
        - network
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: org-id
          required: false
          schema:
            type: string
          description: Filter networks by organization ID
        - in: query
          name: stats
          required: false
          schema:
