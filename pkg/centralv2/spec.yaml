  /api/v2/webhook/{id}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      tags:
        - webhook
      summary: Rotate the webhook signing secret
      description: |
        Generates a new signing secret and places the previous secret into a grace/overlap window. The response contains exactly two active secrets: the new primary (expiryAt null) and the previous primary (expiryAt set to now + overlapHours).
        If an overlap secret is already active (a previous rotation is still within its grace window), rotation is blocked and a 409 Conflict is returned. The caller must first explicitly revoke the overlap secret via DELETE /webhook-secret/{id}, or wait for the grace window to expire, before rotating again. This ensures the active secret count never exceeds two and makes the invariant explicit rather than silently evicting secrets.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The webhook ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateWebhookSecretRequest'
      responses:
        '200':
          description: Webhook with the new and previous secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          description: |
            An overlap secret is already active. Revoke it first via DELETE /webhook-secret/{id} or wait for its grace window to expire.
        '413':
          $ref: '#/components/responses/413'
        '500':
          $ref: '#/components/responses/500'
  /api/v2/webhook-secret/{id}:
    delete:
      operationId: deleteWebhookSecret
      tags:
        - webhook
      summary: Revoke an overlap secret early
      description: |
        Immediately revokes an overlap secret before its grace window expires. The active primary secret (expiryAt null) cannot be deleted — rotate first. Attempting to delete the primary returns 400.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The webhook secret ID to revoke
      responses:
        '200':
          description: Secret revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
components:
  schemas:
    BadRequestResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Human-readable error summary
          example: validation failed
        details:
          type: array
          description: Per-field validation errors, present when the request body fails validation
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: JSON field path that failed validation
                example: name
              message:
                type: string
                description: Reason the field failed validation
                example: name is required
    SuccessMessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable confirmation message
          example: success
    Orgs:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
              permissions:
                $ref: '#/components/schemas/PermissionCheckDetails'
        stats:
          type: object
          required:
            - totalOrgs
          properties:
            totalOrgs:
              type: integer
              description: The total number of organizations the user has access to, or -1 if the total could not be determined due to performance limits.
    OrgResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    CreateOrgRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
      example:
        name: Acme Corp
    UpdateOrgRequest:
      type: object
      properties:
        name:
          type: string
      example:
        name: Acme Corp (Renamed)
    Principals:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - principalType
            properties:
              id:
                type: string
              name:
                type: string
              principalType:
                type: string
                enum:
                  - user
    IamLeaf:
      type: object
      required:
        - id
        - name
        - principalType
        - principals
        - children
      properties:
        id:
          type: string
        name:
          type: string
        principalType:
          type: string
          enum:
            - user
            - team
        principals:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - principalType
              - roles
            properties:
              id:
                type: string
              name:
                type: string
              principalType:
                type: string
                enum:
                  - user
              roles:
                type: array
                items:
                  type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/IamLeaf'
    Iam:
      type: array
      description: All IAM role assignments on a resource
      items:
        $ref: '#/components/schemas/IamTuple'
    IamTuple:
      type: object
      description: An existing IAM role assignment on a resource.
      required:
        - principal
        - principalType
        - roles
      properties:
        principal:
          type: string
          description: Identifier of the principal (email for users and service accounts)
        principalType:
          type: string
          enum:
            - user
            - service_account
          description: The kind of principal that holds these roles
        roles:
          type: array
          description: Roles currently assigned to the principal on this resource
          items:
            $ref: '#/components/schemas/IamRole'
    IamRequest:
      type: array
      description: 'List of principal–roles assignments. Semantics depend on the HTTP method: `POST` adds the specified roles, `DELETE` removes them, `PUT` replaces all existing assignments.'
      items:
        $ref: '#/components/schemas/IamTupleRequest'
      example:
        - principal: alice@example.com
          roles:
            - Admin
        - principal: bob@example.com
          roles:
            - Viewer
    IamTupleRequest:
      type: object
      description: A principal–roles assignment to apply to a resource.
      required:
        - principal
        - roles
      properties:
        principal:
          type: string
          format: email
          description: Email address of the user or service account to assign roles to
          example: alice@example.com
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IamRole'
          description: One or more roles to assign to the principal
      example:
        principal: alice@example.com
        roles:
          - Admin
    IamRole:
      type: string
      enum:
        - Owner
        - Admin
        - Editor
        - Viewer
        - NetworkGroupAdmin
        - NetworkGroupEditor
        - NetworkGroupViewer
        - NetworkAdmin
        - NetworkEditor
        - NetworkViewer
      description: Role of a principal on a resource. Roles are hierarchical and inherited through the resource tree (`org → network group → network`). Org-level roles (`Owner`, `Admin`, `Editor`, `Viewer`) apply to all child resources. Resource-scoped roles (`NetworkGroupAdmin`, `NetworkAdmin`, etc.) apply only at the specified level and below.
    Invite:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          description: List of email addresses to invite
          items:
            type: string
            format: email
      example:
        emails:
          - alice@example.com
          - bob@example.com
    NetworkGroup:
      type: object
      required:
        - id
        - name
        - description
        - orgId
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        orgId:
          type: string
    NetworkGroups:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NetworkGroupSummary'
        stats:
          $ref: '#/components/schemas/NetworkGroupsListStats'
    NetworkGroupSummary:
      type: object
      required:
        - id
        - name
        - description
        - orgId
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        orgId:
          type: string
        stats:
          $ref: '#/components/schemas/NetworkGroupSummaryStats'
        permissions:
          $ref: '#/components/schemas/PermissionCheckDetails'
    NetworkGroupSummaryStats:
      type: object
      required:
        - activeDevices
        - authorizedDevices
        - unauthorizedMemberships
        - totalNetworks
      properties:
        activeDevices:
          type: integer
        authorizedDevices:
          type: integer
        unauthorizedMemberships:
          type: integer
        totalNetworks:
          type: integer
    NetworkGroupsListStats:
      type: object
      required:
        - unauthorizedMemberships
        - authorizedDevices
        - totalNetworks
      properties:
        unauthorizedMemberships:
          type: integer
        authorizedDevices:
          type: integer
        totalNetworks:
          type: integer
    CreateNetworkGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
      example:
        name: Production
        description: Production network group
    UpdateNetworkGroupRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      example:
        name: Production (Updated)
        description: Updated production network group
    Networks:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NetworkSummary'
        stats:
          $ref: '#/components/schemas/NetworksListStats'
    NetworkSummary:
      type: object
      required:
        - id
        - name
        - networkGroupId
        - networkGroupName
        - kind
      properties:
        id:
          type: string
          description: Unique network identifier
        name:
          type: string
          description: Display name of the network
        networkGroupId:
          type: string
          description: ID of the network group this network belongs to
        networkGroupName:
          type: string
          description: Display name of the network group
        description:
          type: string
          description: Description of the network (may be an empty string)
        kind:
          type: string
          description: The kind of ZeroTier network (e.g. `v1`)
        stats:
          $ref: '#/components/schemas/NetworkStats'
        permissions:
          $ref: '#/components/schemas/PermissionCheckDetails'
    NetworkMember:
      type: object
      required:
        - deviceId
        - networkId
        - name
        - description
        - status
        - activeBridge
        - ipv4Assignments
        - ipv6Assignments
        - ipAssignment6plane
        - ipAssignmentRfc4193
        - noAutoAssignIps
        - capabilities
        - tags
        - creationTime
        - lastModified
        - identity
        - revision
        - agentVersion
        - macAddress
        - lastSeen
        - lastSeenIp
        - os
        - arch
      properties:
        deviceId:
          type: string
          description: Unique device identifier
        networkId:
          type: string
          description: ID of the network this member belongs to
        name:
          type: string
          description: Display name of the device
        description:
          type: string
          description: Description of the device
        status:
          type: string
          enum:
            - authorized
            - not_authorized
            - rejected
          description: Authorization status of the device on this network
        activeBridge:
          type: boolean
          description: Whether this device acts as an active bridge
        ipv4Assignments:
          type: array
          description: IPv4 addresses assigned to this device on the network
          items:
            type: string
            format: ipv4
        ipv6Assignments:
          type: array
          description: IPv6 addresses assigned to this device on the network
          items:
            type: string
            format: ipv6
        ipAssignment6plane:
          type: string
          format: ipv6
          description: IPv6 address assigned via 6PLANE addressing
        ipAssignmentRfc4193:
          type: string
          format: ipv6
          description: IPv6 address assigned via RFC 4193 addressing
        noAutoAssignIps:
          type: boolean
          description: Whether automatic IP address assignment is disabled for this device
        capabilities:
          type: array
          description: ZeroTier capability IDs granted to this device
          items:
            type: string
        creationTime:
          type: string
          format: date-time
          description: Time the device was first seen on the network
        lastModified:
          type: string
          format: date-time
          description: Time the member record was last modified
        identity:
          type: string
          description: ZeroTier public identity of the device
        lastAuthorizedCredential:
          type: string
          description: Credential used for the last authorization
        lastAuthorizedTime:
          type: string
          format: date-time
          description: Time the device was last authorized
        lastDeauthorizedTime:
          type: string
          format: date-time
          description: Time the device was last deauthorized
        revision:
          type: integer
          description: Revision counter for the member record
        tags:
          type: array
          description: ZeroTier tag IDs applied to this device
          items:
            type: string
        agentVersion:
          type: string
          description: ZeroTier client version running on the device
        macAddress:
          type: string
          description: MAC address of the device's virtual network interface
        lastSeen:
          type: object
          description: Map of IP/port to last-seen timestamp
          additionalProperties:
            type: string
        lastSeenIp:
          type: string
          description: Last known public IP address of the device
        lastSeenTime:
          type: string
          format: date-time
          description: Time the device was last seen by a controller
        os:
          type: string
          description: Operating system reported by the ZeroTier client
        arch:
          type: string
          description: CPU architecture reported by the ZeroTier client
    NetworkMembers:
      type: array
      items:
        $ref: '#/components/schemas/NetworkMember'
    UpdateMemberRequest:
      type: object
      description: All fields are optional. Only provided fields are updated.
      properties:
        name:
          type: string
          description: Display name for the device
        description:
          type: string
          description: Description of the device (may be an empty string)
        activeBridge:
          type: boolean
          description: Whether this device acts as an active bridge
        noAutoAssignIps:
          type: boolean
          description: Disable automatic IP address assignment for this device
        ipv4Assignments:
          type: array
          description: Static IPv4 addresses to assign to this device
          items:
            type: string
            format: ipv4
        ipv6Assignments:
          type: array
          description: Static IPv6 addresses to assign to this device
          items:
            type: string
            format: ipv6
      example:
        name: Alice's Laptop (updated)
        ipv4Assignments:
          - 10.147.20.10
    PostMembersRequest:
      type: object
      required:
        - deviceId
      properties:
        deviceId:
          type: string
          description: Device ID to add to the network
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-fA-F]{10}$
        name:
          type: string
          description: Display name for the device
        description:
          type: string
          description: Description of the device (may be an empty string)
        activeBridge:
          type: boolean
          description: Whether this device acts as an active bridge
        noAutoAssignIps:
          type: boolean
          description: Disable automatic IP address assignment for this device
        ipv4Assignments:
          type: array
          description: Static IPv4 addresses to assign to this device
          items:
            type: string
            format: ipv4
        ipv6Assignments:
          type: array
          description: Static IPv6 addresses to assign to this device
          items:
            type: string
            format: ipv6
      example:
        deviceId: cafe001234
        name: Alice's Laptop
        description: MacBook Pro
        ipv4Assignments:
          - 10.147.20.5
    DeleteMembersRequest:
      type: object
      required:
        - deviceId
      properties:
        deviceId:
          type: string
          description: Device ID to remove from the network (10-character hex string)
          minLength: 10
          maxLength: 10
          pattern: ^[0-9a-fA-F]{10}$
      example:
        deviceId: cafe001234
    FlowRules:
      oneOf:
        - $ref: '#/components/schemas/FlowRulesCustom'
        - $ref: '#/components/schemas/FlowRulesIsolation'
      discriminator:
        propertyName: kind
        mapping:
          custom: '#/components/schemas/FlowRulesCustom'
          isolation: '#/components/schemas/FlowRulesIsolation'
    FlowRulesCustom:
      type: object
      required:
        - kind
        - config
      properties:
        kind:
          type: string
          enum:
            - custom
          description: The kind of flow rule
        config:
          $ref: '#/components/schemas/FlowRulesCustomConfig'
    FlowRulesCustomConfig:
      type: object
      required:
        - source
      properties:
        source:
          type: string
          description: Raw ZeroTier flow rule source code
    FlowRulesIsolation:
      type: object
      required:
        - kind
        - config
      properties:
        kind:
          type: string
          enum:
            - isolation
          description: The kind of flow rule
        config:
          $ref: '#/components/schemas/FlowRulesIsolationConfig'
    FlowRulesIsolationConfig:
      type: object
      required:
        - blockNonIP
        - enableServiceFilter
        - allowedServices
        - excludedDeviceIds
      properties:
        blockNonIP:
          type: boolean
          description: Whether to block non-IP traffic (e.g. ARP, IPv6 NDP)
        enableServiceFilter:
          type: boolean
          description: Whether to restrict traffic to only the ports and protocols in `allowedServices`
        allowedServices:
          type: array
          description: Ports and protocols to allow when service filtering is enabled
          items:
            $ref: '#/components/schemas/FlowRuleIsolationAllowedPorts'
        excludedDeviceIds:
          type: array
          description: Device IDs exempt from isolation rules (can communicate freely)
          items:
            type: string
            minLength: 10
            maxLength: 10
            pattern: ^[0-9a-fA-F]{10}$
    FlowRuleIsolationAllowedPorts:
      type: object
      required:
        - ports
        - protocol
      properties:
        ports:
          type: string
          description: 'Port list in ZeroTier format: single port (`80`), range (`8000-9000`), or comma-separated'
        protocol:
          type: integer
          minimum: 0
          maximum: 255
          description: IP protocol number (e.g. 6 = TCP, 17 = UDP, 1 = ICMP)
    UpdateFlowRulesRequest:
      oneOf:
        - $ref: '#/components/schemas/UpdateFlowRulesCustomRequest'
        - $ref: '#/components/schemas/UpdateFlowRulesIsolationRequest'
      discriminator:
        propertyName: kind
        mapping:
          custom: '#/components/schemas/UpdateFlowRulesCustomRequest'
          isolation: '#/components/schemas/UpdateFlowRulesIsolationRequest'
    UpdateFlowRulesCustomRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - custom
          description: The kind of flow rule
        config:
          $ref: '#/components/schemas/UpdateFlowRulesCustomConfig'
      example:
        kind: custom
        config:
          source: |-
            drop ethertype ipv6
            accept
    UpdateFlowRulesCustomConfig:
      type: object
      properties:
        source:
          type: string
          description: Raw ZeroTier flow rule source code
    UpdateFlowRulesIsolationRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - isolation
          description: The kind of flow rule
        config:
          $ref: '#/components/schemas/UpdateFlowRulesIsolationConfig'
      example:
        kind: isolation
        config:
          blockNonIP: true
          enableServiceFilter: true
          allowedServices:
            - ports: '443'
              protocol: 6
            - ports: '53'
              protocol: 17
          excludedDeviceIds:
            - cafe001234
    UpdateFlowRulesIsolationConfig:
      type: object
      description: All fields are optional. Only provided fields are updated.
      properties:
        blockNonIP:
          type: boolean
          description: Whether to block non-IP traffic (e.g. ARP, IPv6 NDP)
        enableServiceFilter:
          type: boolean
          description: Whether to restrict traffic to only the ports and protocols in `allowedServices`
        allowedServices:
          type: array
          description: Ports and protocols to allow when service filtering is enabled
          items:
            $ref: '#/components/schemas/FlowRuleIsolationAllowedPorts'
        excludedDeviceIds:
          type: array
          description: Device IDs exempt from isolation rules (can communicate freely)
          items:
            type: string
            minLength: 10
            maxLength: 10
            pattern: ^[0-9a-fA-F]{10}$
    ServiceAccounts:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccountResponse'
    ServiceAccountResponse:
      type: object
      required:
        - id
        - name
        - description
        - orgId
        - apiKeys
        - creationTime
        - lastModified
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        orgId:
          type: string
        apiKeys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyResponse'
        creationTime:
          type: string
          format: date-time
          description: Time the service account was created
          readOnly: true
        lastModified:
          type: string
          format: date-time
          description: Time the service account was last modified
          readOnly: true
    CreateServiceAccountRequest:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      example:
        id: ci-deploy
        name: CI Deploy Bot
        description: Used by the CI pipeline to manage networks
    UpdateServiceAccountRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      example:
        name: CI Deploy Bot v2
        description: Updated deploy bot for v2 pipeline
    ApiKeyResponse:
      type: object
      required:
        - id
        - serviceAccountId
        - description
        - creationTime
        - lastModified
      properties:
        id:
          type: string
        serviceAccountId:
          type: string
        description:
          type: string
        expires:
          type: string
          format: date-time
          description: Expiration time of the API key
        creationTime:
          type: string
          format: date-time
          description: Time the API key was created
        lastModified:
          type: string
          format: date-time
          description: Time the API key was last modified
        lastUsed:
          type: string
          format: date-time
          description: Time the API key was last used
    NewApiKeyResponse:
      type: object
      required:
        - id
        - serviceAccountId
        - description
        - expires
        - key
        - creationTime
        - lastModified
      properties:
        id:
          type: string
        serviceAccountId:
          type: string
        description:
          type: string
        expires:
          type: string
          format: date-time
          description: Expiration time of the API key
        key:
          type: string
          description: The API key value
        creationTime:
          type: string
          format: date-time
          description: Time the API key was created
        lastModified:
          type: string
          format: date-time
          description: Time the API key was last modified
    CreateApiKeyRequest:
      type: object
      required:
        - expires
      properties:
        description:
          type: string
        expires:
          type: string
          format: date-time
      example:
        description: CI deploy key — expires annually
        expires: '2027-04-08T00:00:00Z'
    UpdateApiKeyRequest:
      type: object
      properties:
        description:
          type: string
      example:
        description: Updated key description
    SearchResult:
      type: object
      properties:
        found:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the user
          readOnly: true
        email:
          type: string
          format: email
          description: Email address of the user (unique within ZeroTier)
          readOnly: true
        firstName:
          type: string
        lastName:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
      example:
        firstName: Alice
        lastName: Smith
    CheckPermissionRequest:
      type: object
      required:
        - resourceId
        - resourceType
        - permission
      properties:
        resourceId:
          type: string
          description: The ID of the resource to check permissions for
        resourceType:
          type: string
          enum:
            - org
            - network_group
            - network
          description: The type of resource to check permissions for
        permission:
          type: string
          description: The permission to check
      example:
        resourceId: a1b2c3d4e5
        resourceType: network
        permission: updateNetwork
    CheckPermissionResponse:
      type: object
      required:
        - resourceId
        - resourceType
        - permission
        - allowed
      properties:
        resourceId:
          type: string
          description: The ID of the resource that was checked
        resourceType:
          type: string
          enum:
            - org
            - network_group
            - network
          description: The type of resource that was checked
        permission:
          type: string
          description: The permission that was checked
        allowed:
          type: boolean
          description: Whether the permission is allowed
    WebhookSecret:
      type: object
      required:
        - id
        - webhookId
        - value
        - createdAt
        - lastModified
      properties:
        id:
          type: string
        webhookId:
          type: string
        value:
          type: string
          description: The HMAC-SHA256 signing secret value
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        expiryAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When set, the secret is in a grace/overlap window and will stop being valid after this time. Null means this is the active primary secret.
    WebhookResponse:
      type: object
      required:
        - id
        - orgId
        - url
        - eventList
        - secrets
        - createdAt
        - lastModified
      properties:
        id:
          type: string
        orgId:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
          description: The HTTPS endpoint URL that will receive webhook events. Must be a fully-qualified domain name (FQDN) — raw IP addresses are not allowed. The domain must not resolve to private or internal IP ranges (RFC1918, loopback, link-local, etc.).
        eventList:
          type: array
          items:
            type: string
          description: Event types that trigger this webhook
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSecret'
          description: |
            Active secrets for this webhook. Normally contains one entry (the primary). During a rotation overlap window there will be two: the new primary (expiryAt null) and the previous primary (expiryAt set).
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
    WebhooksList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookResponse'
    CreateWebhookRequest:
      type: object
      required:
        - url
        - eventList
      properties:
        description:
          type: string
          maxLength: 255
        url:
          type: string
          format: uri
          description: The HTTPS endpoint URL that will receive webhook events. Must be a fully-qualified domain name (FQDN) — raw IP addresses are not allowed. The domain must not resolve to private or internal IP ranges (RFC1918, loopback, link-local, etc.).
          example: https://hooks.example.com/zerotier/events
        eventList:
          type: array
          minItems: 1
          items:
            type: string
    UpdateWebhookRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 255
        url:
          type: string
          format: uri
          description: The HTTPS endpoint URL that will receive webhook events. Must be a fully-qualified domain name (FQDN) — raw IP addresses are not allowed. The domain must not resolve to private or internal IP ranges (RFC1918, loopback, link-local, etc.).
        eventList:
          type: array
          minItems: 1
          items:
            type: string
    RotateWebhookSecretRequest:
      type: object
      properties:
        overlapHours:
          type: integer
          minimum: 0
          maximum: 720
          default: 24
          description: |
            How many hours the previous secret remains valid after rotation. Defaults to 24. Use 0 for an immediate hard cutover with no overlap.
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error message
          example: an error occurred
    PermissionCheckDetails:
      type: object
      description: Map of permission name to whether the authenticated principal has that permission on the resource
      additionalProperties:
        type: boolean
    NumericEntitlement:
      type: object
      required:
        - value
        - kind
        - max
        - hasUnlimitedUsage
      properties:
        value:
          type: integer
        max:
          type: integer
          description: Maximum allowed
        kind:
          type: string
          enum:
            - numeric-hard-cap
            - numeric-soft-cap
        hasUnlimitedUsage:
          type: boolean
          description: True if unlimited usages allowed.
        resetPeriod:
          type: string
          enum:
            - hourly
            - daily
            - weekly
            - monthly
            - yearly
        resetsWhen:
          type: string
          format: date-time
    BooleanEntitlement:
      type: object
      required:
        - value
        - kind
      properties:
        value:
          type: boolean
        kind:
          type: string
          enum:
            - boolean
    SubscriptionEntitlements:
      type: object
      required:
        - admins
        - devices
        - networks
        - networkGroups
        - customRoutes
        - customDns
        - flowRulesCustom
        - flowRulesTemplates
        - publicNetworks
        - fullRebac
        - serviceAccounts
        - api
        - webhooks
      properties:
        admins:
          $ref: '#/components/schemas/NumericEntitlement'
        devices:
          $ref: '#/components/schemas/NumericEntitlement'
        networks:
          $ref: '#/components/schemas/NumericEntitlement'
        networkGroups:
          $ref: '#/components/schemas/NumericEntitlement'
        customRoutes:
          $ref: '#/components/schemas/BooleanEntitlement'
        customDns:
          $ref: '#/components/schemas/BooleanEntitlement'
        flowRulesCustom:
          $ref: '#/components/schemas/BooleanEntitlement'
        flowRulesTemplates:
          $ref: '#/components/schemas/BooleanEntitlement'
        publicNetworks:
          $ref: '#/components/schemas/BooleanEntitlement'
        fullRebac:
          $ref: '#/components/schemas/BooleanEntitlement'
        serviceAccounts:
          $ref: '#/components/schemas/NumericEntitlement'
        api:
          $ref: '#/components/schemas/NumericEntitlement'
        webhooks:
          $ref: '#/components/schemas/NumericEntitlement'
    Subscription:
      type: object
      required:
        - id
        - plan
        - planDisplayName
        - status
        - entitlements
      properties:
        id:
          type: string
        plan:
          type: string
          enum:
            - plan-zt1-basic
            - plan-zt1-essential
            - plan-zt1-scale
            - plan-zt1-premium
        planDisplayName:
          type: string
        status:
          type: string
          enum:
            - active
            - in-trial
            - past-due
        entitlements:
          $ref: '#/components/schemas/SubscriptionEntitlements'
    NetworkStats:
      type: object
      required:
        - totalDevices
        - authorizedDevices
        - activeDevices
        - rejectedDevices
        - notAuthorizedDevices
      properties:
        totalDevices:
          type: integer
          description: Total number of devices (all statuses)
        authorizedDevices:
          type: integer
          description: Number of authorized devices
        activeDevices:
          type: integer
          description: Number of devices that have been seen recently
        rejectedDevices:
          type: integer
          description: Number of rejected devices
        notAuthorizedDevices:
          type: integer
          description: Number of devices pending authorization
    NetworksListStats:
      type: object
      required:
        - authorizedDevices
        - unauthorizedMemberships
      properties:
        authorizedDevices:
          type: integer
          description: Total number of authorized devices across all networks
        unauthorizedMemberships:
          type: integer
          description: Total number of devices pending authorization across all networks
    DNS:
      type: object
      required:
        - domain
        - servers
      properties:
        domain:
          type: string
          example: some.domain
          description: Search domain to use for DNS records
          maxLength: 253
        servers:
          type: array
          maxItems: 10
          items:
            type: string
          example:
            - 10.0.0.3
          description: IP addresses of unicast DNS servers (IPv4 or IPv6)
    IPRange:
      type: object
      required:
        - ipRangeStart
        - ipRangeEnd
      properties:
        ipRangeStart:
          type: string
          description: Start of the IP address range (inclusive)
          example: 10.0.0.1
        ipRangeEnd:
          type: string
          description: End of the IP address range (inclusive)
          example: 10.0.0.255
    Route:
      type: object
      required:
        - target
        - via
      properties:
        target:
          type: string
          description: Destination CIDR for this route
          example: 10.0.0.0/24
        via:
          type: string
          description: Next-hop IP address, or null to route directly on the ZeroTier network
          example: null
    IPV4AssignMode:
      type: object
      required:
        - zt
      properties:
        zt:
          type: boolean
          example: true
          description: Enable ZeroTier auto-assignment of IPv4 addresses from the assignment pool
    IPV6AssignMode:
      type: object
      required:
        - zt
        - rfc4193
        - 6plane
      properties:
        6plane:
          type: boolean
          example: true
          description: Enable 6PLANE addressing (a /80 per device from a /40 assigned to the network)
        rfc4193:
          type: boolean
          example: false
          description: Enable RFC 4193 private addressing (a /128 per device from a /88 assigned to the network)
        zt:
          type: boolean
          example: false
          description: Enable ZeroTier auto-assignment of IPv6 addresses from the assignment pool
    NetworkConfigRequest:
      type: object
      description: Network configuration. All fields are optional when updating.
      properties:
        dns:
          $ref: '#/components/schemas/DNS'
        enableBroadcast:
          type: boolean
          example: true
          description: Enable broadcast packets on the network
        v4Subnet:
          type: string
          description: CIDR subnet that defines the IPv4 network boundary
          example: 192.168.0.0/16
        v6Subnet:
          type: string
          description: CIDR subnet that defines the IPv6 network boundary
          example: 2001:db8::/32
        v4IpAssignmentPools:
          type: array
          description: IP address ranges for the IPv4 auto-assignment pool
          items:
            $ref: '#/components/schemas/IPRange'
        v6IpAssignmentPools:
          type: array
          description: IP address ranges for the IPv6 auto-assignment pool
          items:
            $ref: '#/components/schemas/IPRange'
        mtu:
          type: integer
          example: 2800
          description: MTU to set on the client virtual network adapter
        multicastLimit:
          type: integer
          example: 32
          description: Maximum number of recipients per multicast or broadcast. Warning — setting this to 0 will disable IPv4 communication on your network!
        private:
          type: boolean
          example: true
          description: Whether the network is private. If `false`, devices will **not** need to be authorized to join.
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
          description: Static routes to push to network members
        v4AssignmentMode:
          $ref: '#/components/schemas/IPV4AssignMode'
        v6AssignmentMode:
          $ref: '#/components/schemas/IPV6AssignMode'
    CreateNetworkRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Display name for the network
          minLength: 3
          maxLength: 127
        description:
          type: string
          description: Description of the network (may be an empty string)
          maxLength: 1024
        config:
          $ref: '#/components/schemas/NetworkConfigRequest'
      example:
        name: office-network
        description: Main office network
        config:
          private: true
          v4Subnet: 10.147.20.0/24
          v4IpAssignmentPools:
            - ipRangeStart: 10.147.20.1
              ipRangeEnd: 10.147.20.254
          v4AssignmentMode:
            zt: true
          v6AssignmentMode:
            zt: false
            rfc4193: false
            6plane: false
          dns:
            domain: office.local
            servers:
              - 10.147.20.1
          routes:
            - target: 10.147.20.0/24
              via: null
          enableBroadcast: true
          mtu: 2800
          multicastLimit: 32
    NetworkConfigResponse:
      type: object
      required:
        - dns
        - enableBroadcast
        - v4Subnet
        - v6Subnet
        - v4IpAssignmentPools
        - v6IpAssignmentPools
        - mtu
        - multicastLimit
        - private
        - routes
        - v4AssignmentMode
        - v6AssignmentMode
      properties:
        dns:
          $ref: '#/components/schemas/DNS'
        enableBroadcast:
          type: boolean
          example: true
          description: Enable broadcast packets on the network
        v4Subnet:
          type: string
          description: CIDR subnet that defines the IPv4 network boundary
          example: 192.168.0.0/16
        v6Subnet:
          type: string
          description: CIDR subnet that defines the IPv6 network boundary
          example: 2001:db8::/32
        v4IpAssignmentPools:
          type: array
          description: IP address ranges for the IPv4 auto-assignment pool
          items:
            $ref: '#/components/schemas/IPRange'
        v6IpAssignmentPools:
          type: array
          description: IP address ranges for the IPv6 auto-assignment pool
          items:
            $ref: '#/components/schemas/IPRange'
        mtu:
          type: integer
          example: 2800
          description: MTU to set on the client virtual network adapter
        multicastLimit:
          type: integer
          example: 32
          description: Maximum number of recipients per multicast or broadcast. Warning — setting this to 0 will disable IPv4 communication on your network!
        private:
          type: boolean
          example: true
          description: Whether the network is private. If `false`, devices will **not** need to be authorized to join.
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
          description: Static routes pushed to network members
        v4AssignmentMode:
          $ref: '#/components/schemas/IPV4AssignMode'
        v6AssignmentMode:
          $ref: '#/components/schemas/IPV6AssignMode'
    NetworkResponse:
      type: object
      required:
        - id
        - name
        - networkGroupId
        - config
        - creationTime
        - lastModified
        - kind
      properties:
        id:
          type: string
          description: Unique network identifier
        name:
          type: string
          description: Display name of the network
        networkGroupId:
          type: string
          description: ID of the network group this network belongs to
        description:
          type: string
          description: Description of the network (may be an empty string)
        config:
          $ref: '#/components/schemas/NetworkConfigResponse'
        creationTime:
          type: string
          format: date-time
          description: Time the network was created
        lastModified:
          type: string
          format: date-time
          description: Time the network was last modified
        kind:
          type: string
          description: The kind of ZeroTier network (e.g. `v1`)
    UpdateNetworkRequest:
      type: object
      description: All fields are optional. Only provided fields are updated.
      properties:
        name:
          type: string
          description: Display name for the network
          minLength: 3
          maxLength: 127
        description:
          type: string
          description: Description of the network (may be an empty string)
          maxLength: 1024
        config:
          $ref: '#/components/schemas/NetworkConfigRequest'
      example:
        name: office-network-v2
        config:
          mtu: 2800
          private: true
  responses:
    '400':
      description: Invalid data provided
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestResponse'
    '401':
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    '403':
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    '413':
      description: Request body exceeds the 1 MB size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API key issued to a service account. Create a service account under an organization and generate an API key via the service account endpoints. Keys can have an optional expiry and can be revoked at any time.
x-tagGroups:
  - name: Identity & Access
    tags:
      - user
      - org
  - name: Networking
    tags:
      - network-group
      - network
      - member
  - name: Automation
    tags:
      - service-account
      - webhook
